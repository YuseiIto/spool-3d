name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
      - run: npm ci
      # Ordered so the cheapest checks fail first. Unlike a framework-generated project,
      # nothing here needs a build to exist before it can be analysed.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:ci
      - run: npm test
      - run: npm run build
